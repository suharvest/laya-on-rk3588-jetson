[project]
name = "edge-workbench"
version = "0.1.1"
description = "Local command selection service for the SenseCraft workbench"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=12,<14",
  "numpy>=1.26,<3",
  "tokenizers>=0.20,<1",
  "psutil>=7,<8",
  "ruamel.yaml>=0.18,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
edge-workbench = "edge_workbench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_workbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
