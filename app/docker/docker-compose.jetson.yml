services:
  edge-workbench:
    image: edge-command-workbench:jetson-jp6-0.2.0
    container_name: edge-command-workbench-jetson
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      DECISION_BACKEND: tensorrt
      MODEL_PATH: /models/model.engine
      TOKENIZER_PATH: /models/tokenizer
      MODEL_METADATA_PATH: /models/model_metadata.json
      TARGET_METADATA_PATH: /app/docker/target-metadata.jetson.json
      # Override SEQ_LEN/EXPECTED_SEQ_LEN only with matching engine metadata
      SEQ_LEN: "90"
      MAX_OPTIONS: "16"
      EXPECTED_BACKEND: tensorrt
      EXPECTED_SEQ_LEN: "90"
      EXPECTED_MAX_OPTIONS: "16"
      LD_LIBRARY_PATH: /usr/lib/python3.10/dist-packages/tensorrt:/host-nvidia-libs:/host-libs:/host-cuda
      PYTHONPATH: /app:/opt/venv/lib/python3.10/site-packages:/usr/lib/python3.10/dist-packages
    volumes:
      - ${LAYA_JETSON_MODEL_DIR:-/opt/laya-jetson/model}:/models:ro
      - /usr/local/cuda/lib64:/host-cuda:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia-libs:ro
      - /lib/aarch64-linux-gnu:/host-libs:ro
      - /usr/lib/python3.10/dist-packages/tensorrt:/usr/lib/python3.10/dist-packages/tensorrt:ro
